<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BiteDJ visuals</title>
<!-- hydra-synth vendored from unpkg, version 1.4.0. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="vendor/hydra-synth.js"></script>
<script src="palette.js"></script>
<!-- Where the sets file and the uploads are, and the XHR that reads them. -->
<script src="paths.js"></script>
<script src="feed.js"></script>
<!-- The active visuals set (Task A7). Before patterns.js and video.js, which
     narrow their pools with it. -->
<script src="sets.js"></script>
<!-- Generated by tools/build-pattern-index.py from the git-ignored pattern
     assets; absent on a checkout that has no assets/patterns/, which
     patterns.js logs and survives. -->
<script src="assets/patterns/index.js"></script>
<script src="patterns.js"></script>
<!-- Generated by tools/build-video-index.py from the git-ignored clips;
     absent on a checkout that has no assets/video/, which video.js logs and
     survives. -->
<script src="assets/video/index.js"></script>
<script src="video.js"></script>
<script src="sketches.js"></script>
<script src="director.js"></script>
<!-- Desktop preview controls; does nothing unless the URL has ?preview=1. -->
<script src="preview.js"></script>
</body>
</html>
